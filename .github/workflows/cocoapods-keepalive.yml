name: CocoaPods Trunk Keepalive

on:
  schedule:
    # Every 2 days at 09:00 UTC — trunk sessions expire after ~3 days of inactivity;
    # running every 2 days keeps a safe margin under that threshold.
    - cron: "0 9 */2 * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Keep CocoaPods Trunk Token Alive
    runs-on: ubuntu-latest

    steps:
      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Ping CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          # Capture output without set -e so a failing command doesn't abort silently.
          set +e
          OUTPUT=$(pod trunk me 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ] || ! echo "$OUTPUT" | grep -q "Name:"; then
            echo "error: CocoaPods trunk token appears invalid or expired." >&2
            exit 1
          fi
          echo "CocoaPods trunk token is active."
